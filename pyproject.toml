[project]
name = "robots-go2"
version = "2.0.0"
description = "Unitree Go2 Forge robot driver and Dora node"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dora-rs>=1.0.1,<2",
    "forge-common>=2.1.0,<3",
    "forge-msgs>=2.0.0,<3",
    "forge-robot>=2.0.0,<3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "unitree-sdk2py",
]

[project.scripts]
robots-go2 = "robots_go2.main:main"
go2 = "robots_go2.main:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "robots_go2"
module-root = "src"

[tool.uv.sources]
unitree-sdk2py = { path = "packaging/vendor/unitree_sdk2_python" }

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
pyinstaller = ["pyinstaller>=6.0"]
