name: Forge 2.x dependency metadata
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.13.7
      - name: Verify project and packaging locks
        run: |
          uv lock --check
          uv lock --check --project packaging
      - name: Check Python source syntax
        run: python -m compileall -q src
